# LOCAL OVERRIDE - not upstream. Delete this file to return to stock behaviour.
#
# WHAT THIS DOES NOW: constrains a local research workbench, and nothing else.
# It no longer patches the application. Two earlier patches are retired here:
#
#   patched/config.py            obsolete once a real Zep key was configured
#   patched/llm_client.py        obsolete once the source fixed truncation at
#                                the call site (ontology_generator.py:235 passes
#                                max_tokens=None, and chat_json raises
#                                LLMResponseError on finish_reason == "length"
#                                with one uncapped retry)
#
# Both are kept as *.disabled for reference and each says in its own header why
# it was retired. Read those before reinstating either.
#
# WHY `build` AND NO DIGEST PIN. A pinned image plus a mounted source file is
# two definitions of one program: the code that runs is not the code in this
# checkout, and the mount silently breaks the moment the pin moves. Building
# from this tree makes the running container BE this checkout - one definition -
# and it is what makes the source-level truncation fix take effect at all. The
# pinned digest (sha256:d236402e...) predates that fix.
#
# The cost is honest and worth stating: `docker compose up --build` compiles
# locally (python:3.11 + npm ci x2 + uv sync) instead of pulling a tested image,
# so the first start is slow and the running code is newer than anything upstream
# tagged. For a quarantined hypothesis generator that is the right trade; for
# anything feeding a decision it would not be.

services:
  mirofish:
    build:
      context: .
      dockerfile: Dockerfile
    image: mirofish-local:checkout
    # Local research workbench: never expose the unauthenticated API to the LAN.
    # !override replaces upstream ports instead of retaining 0.0.0.0 bindings.
    ports: !override
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5001:5001"
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=4).read(); urllib.request.urlopen('http://127.0.0.1:3000/', timeout=4).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - ./backend/uploads:/app/backend/uploads
